spring.application.name=ecommerce
server.port=${PORT:8081}

# Dialecto explicito de PostgreSQL para Hibernate (evita errores de metadata en arranque)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuracion de Base de Datos compatible con Localhost y Entornos Cloud (Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracion del Pool de Conexiones (HikariCP)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Configuracion JWT
app.jwt.secret=${APP_JWT_SECRET:EcommerceSecureKeyParquesoftBootcamp2026Segura}
app.jwt.expiration-milliseconds=${APP_JWT_EXPIRATION:86400000}
